<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Fresh Roots</title>
<meta name="description" content="Browse fresh, farm-graded produce sold directly by the growers who picked it.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
 
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="dot"></span>Fresh<span>Roots</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="farmer/dashboard.html">Sell on Fresh Roots</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Daylight Mode">☀️ Daylight</button>
      <a href="login.html" class="nav-icon-btn" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </a>
      <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
        <span class="cart-count">0</span>
      </a>
      <button class="menu-toggle" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</nav>
 
<section style="padding-top:48px;">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">🌱 Direct Farm Market</span>
        <h2>Fresh Harvest Straight From Farmers</h2>
      </div>
      <p id="result-count">Showing all products</p>
    </div>
 
    <div class="filter-bar" id="filter-bar">
      <button class="chip active" data-category="All">All</button>
      <button class="chip" data-category="Vegetables">Vegetables</button>
      <button class="chip" data-category="Fruits">Fruits</button>
      <button class="chip" data-category="Dairy">Dairy</button>
      <button class="chip" data-category="Grains">Grains</button>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search produce or farmer…">
      </div>
    </div>
 
    <div class="product-grid" id="shop-grid"></div>
    <p class="empty-state" id="empty-state">No products match your search. Try another term or category.</p>
  </div>
</section>
 
<footer>
  <div class="container footer-inner">
    <p>&copy; 2026 Fresh Roots. Farm-to-consumer platform.</p>
    <div class="footer-links">
      <a href="shop.html">Shop</a>
      <a href="farmer/dashboard.html">Farmers</a>
      <a href="login.html">Account</a>
    </div>
  </div>
</footer>
 
<script src="js/products.js"></script>
<script src="js/ui.js"></script>
<script src="js/script.js"></script>
<script>
  const shopGrid = document.getElementById('shop-grid');
  const emptyState = document.getElementById('empty-state');
  const resultCount = document.getElementById('result-count');
  const searchInput = document.getElementById('search-input');
  const chips = document.querySelectorAll('#filter-bar .chip');
 
  const params = new URLSearchParams(window.location.search);
  let activeCategory = params.get('category') || 'All';
  let activeSearch = '';
 
  function syncActiveChip() {
    chips.forEach(chip => {
      chip.classList.toggle('active', chip.dataset.category === activeCategory);
    });
  }
 
  function applyFilters() {
    let results = PRODUCTS.filter(p => activeCategory === 'All' || p.category === activeCategory);
    if (activeSearch.trim()) {
      const q = activeSearch.trim().toLowerCase();
      results = results.filter(p => p.name.toLowerCase().includes(q) || p.farmer.toLowerCase().includes(q));
    }
    renderGrid(shopGrid, results);
    emptyState.style.display = results.length ? 'none' : 'block';
    resultCount.textContent = results.length
      ? `Showing ${results.length} product${results.length === 1 ? '' : 's'}`
      : 'No matches';
  }
 
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.category;
      syncActiveChip();
      applyFilters();
    });
  });
 
  searchInput.addEventListener('input', (e) => {
    activeSearch = e.target.value;
    applyFilters();
  });
 
  syncActiveChip();
  applyFilters();
</script>
</body>
</html>
