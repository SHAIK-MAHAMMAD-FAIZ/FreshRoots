<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Fresh Roots</title>
  <meta name="description" content="Create your Fresh Roots account and start buying farm-fresh produce.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Same auth styles as login */
    .auth-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--surface-line);
      border-radius: var(--radius);
      padding: 36px;
      width: 100%;
      max-width: 420px;
    }
    .auth-card h2 {
      margin-top: 8px;
      margin-bottom: 24px;
    }
    .auth-card .field {
      margin-bottom: 18px;
    }
    .auth-card label {
      display: block;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .auth-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--surface-line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s var(--ease);
    }
    .auth-card input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }
    .auth-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .auth-footer a {
      color: var(--green);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="dot"></span>Fresh<span>Roots</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="farmer/dashboard.html">Sell on Fresh Roots</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="nav-icon-btn" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a>
        <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
          <span class="cart-count">0</span>
        </a>
        <button class="menu-toggle" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register form -->
  <main class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">// Join the network</span>
      <h2>Create your account</h2>
      <form id="register-form">
        <div class="field">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="Your name" required minlength="2">
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="reg-phone">Mobile Number</label>
          <input type="tel" id="reg-phone" placeholder="10-digit mobile" required pattern="[0-9]{10}">
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Repeat password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">Register</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-inner">
      <p>&copy; 2026 Fresh Roots. Farm-to-consumer platform.</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="farmer/dashboard.html">Farmers</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
