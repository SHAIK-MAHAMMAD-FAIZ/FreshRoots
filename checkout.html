<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Fresh Roots</title>
  <meta name="description" content="Complete your order with Fresh Roots — fresh produce, direct from farmers.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nav (same) -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="dot"></span>Fresh<span>Roots</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="farmer/dashboard.html">Sell on Fresh Roots</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="nav-icon-btn" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a>
        <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
          <span class="cart-count">0</span>
        </a>
        <button class="menu-toggle" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding: 48px 0 80px;">
    <div class="section-head">
      <div>
        <span class="eyebrow">Final step</span>
        <h2>Checkout</h2>
      </div>
      <p>Complete your order — delivery within 24 hours.</p>
    </div>

    <div id="checkout-content">
      <!-- Form and summary go here -->
    </div>

    <!-- Success state (hidden by default) -->
    <div id="success-state" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:48px; margin-bottom:20px;">✅</div>
      <h2 style="margin-bottom:12px;">Order Confirmed!</h2>
      <p style="color:var(--text-dim); margin-bottom:8px;">Your order has been placed successfully.</p>
      <p style="font-family:var(--font-mono); color:var(--green); margin-bottom:24px;" id="order-id"></p>
      <a href="shop.html" class="btn btn-primary">Continue shopping</a>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>&copy; 2026 Fresh Roots. Farm-to-consumer platform.</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="farmer/dashboard.html">Farmers</a>
        <a href="login.html">Account</a>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script.js"></script>
  <script>
    const checkoutContent = document.getElementById('checkout-content');
    const successState = document.getElementById('success-state');
    const orderIdEl = document.getElementById('order-id');

    function renderCheckout() {
      const items = getCartDetailed();
      const total = getCartTotal();
      const count = getCartCount();

      updateCartBadge();

      // If cart empty, redirect to cart
      if (items.length === 0) {
        window.location.href = 'cart.html';
        return;
      }

      let html = `
        <div style="display:grid; grid-template-columns: 1.2fr 0.8fr; gap:40px; align-items:start;">
          <!-- Form column -->
          <div style="background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius); padding:24px;">
            <h3 style="margin-bottom:20px;">Delivery details</h3>
            <form id="checkout-form" style="display:flex; flex-direction:column; gap:16px;">
              <div>
                <label style="display:block; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:6px;">Full Name</label>
                <input type="text" id="cust-name" required placeholder="Your name" style="width:100%; background:var(--bg); border:1px solid var(--surface-line); border-radius:var(--radius-sm); padding:12px; color:var(--text); outline:none;">
              </div>
              <div>
                <label style="display:block; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:6px;">Mobile Number</label>
                <input type="tel" id="cust-phone" required pattern="[0-9]{10}" placeholder="10-digit mobile" style="width:100%; background:var(--bg); border:1px solid var(--surface-line); border-radius:var(--radius-sm); padding:12px; color:var(--text); outline:none;">
              </div>
              <div>
                <label style="display:block; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:6px;">Delivery Address</label>
                <textarea id="cust-address" required rows="3" placeholder="House no, street, landmark, city, pincode" style="width:100%; background:var(--bg); border:1px solid var(--surface-line); border-radius:var(--radius-sm); padding:12px; color:var(--text); outline:none;"></textarea>
              </div>
              <div>
                <label style="display:block; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:6px;">Delivery Slot</label>
                <select id="cust-slot" required style="width:100%; background:var(--bg); border:1px solid var(--surface-line); border-radius:var(--radius-sm); padding:12px; color:var(--text); outline:none;">
                  <option value="">Select a slot</option>
                  <option value="morning">Tomorrow, 6 AM – 10 AM</option>
                  <option value="noon">Tomorrow, 10 AM – 2 PM</option>
                  <option value="evening">Tomorrow, 4 PM – 8 PM</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Place Order · ₹${total}</button>
            </form>
          </div>

          <!-- Order summary column -->
          <div style="background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius); padding:24px; position:sticky; top:100px;">
            <h3 style="margin-bottom:20px;">Order Summary</h3>
            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
              ${items.map(({ product, qty }) => `
                <div style="display:flex; justify-content:space-between; font-size:14px;">
                  <span>${product.name} × ${qty}</span>
                  <span style="font-family:var(--font-mono);">₹${product.price * qty}</span>
                </div>
              `).join('')}
            </div>
            <div style="border-top:1px solid var(--surface-line); padding-top:16px; display:flex; justify-content:space-between; align-items:baseline;">
              <span style="font-family:var(--font-mono); font-size:12px; color:var(--text-dim);">Total</span>
              <span style="font-family:var(--font-mono); font-size:22px; color:var(--yellow);">₹${total}</span>
            </div>
            <p style="margin-top:12px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint);">// includes delivery & handling</p>
          </div>
        </div>
      `;
      checkoutContent.innerHTML = html;

      // Handle form submission
      document.getElementById('checkout-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const orderId = 'FR-' + Date.now().toString().slice(-6);
        const customer = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const slot = document.getElementById('cust-slot').value;
        const itemsList = items.map(({ product, qty }) => `${product.name} ×${qty}`);

        const orderPayload = {
          id: orderId,
          customer,
          phone,
          address,
          slot,
          items: itemsList,
          total,
          status: 'Pending'
        };

        try {
          await fetch('http://localhost:4000/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderPayload)
          });
        } catch (err) {
          console.warn('API post failed, order kept locally', err);
        }

        clearCart();
        updateCartBadge();
        checkoutContent.style.display = 'none';
        successState.style.display = 'block';
        orderIdEl.textContent = `Order ID: ${orderId}`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('Order placed successfully! Farmer notified.');
      });
    }

    // Initial render
    renderCheckout();
  </script>
</body>
</html>
