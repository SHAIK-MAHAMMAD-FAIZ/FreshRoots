<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Fresh Roots</title>
  <meta name="description" content="Review your fresh farm picks, adjust quantities, and proceed to checkout.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="dot"></span>Fresh<span>Roots</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="farmer/dashboard.html">Sell on Fresh Roots</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="nav-icon-btn" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a>
        <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
          <span class="cart-count">0</span>
        </a>
        <button class="menu-toggle" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding: 48px 0 80px;">
    <div class="section-head">
      <div>
        <span class="eyebrow">Your selection</span>
        <h2>Cart</h2>
      </div>
      <p id="cart-subhead">Review your items before checkout.</p>
    </div>

    <div id="cart-items-container">
      <!-- Dynamically populated -->
    </div>

    <div id="cart-empty" style="text-align:center; padding:60px 20px; display:none;">
      <p style="font-family:var(--font-mono); color:var(--text-dim); margin-bottom:20px;">// CART EMPTY — nothing scanned yet</p>
      <a href="shop.html" class="btn btn-primary">Start shopping</a>
    </div>

    <div id="cart-summary" style="display:none; margin-top:40px; border-top:1px solid var(--surface-line); padding-top:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
        <button class="btn btn-ghost" id="clear-cart-btn">Clear cart</button>
        <div style="text-align:right;">
          <div style="font-family:var(--font-mono); font-size:14px; color:var(--text-dim);">Subtotal</div>
          <div style="font-family:var(--font-mono); font-size:28px; color:var(--yellow);" id="cart-total">₹0</div>
        </div>
        <a href="checkout.html" class="btn btn-primary" style="font-size:16px; padding:14px 28px;">
          Proceed to checkout
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>&copy; 2026 Fresh Roots. Farm-to-consumer platform.</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="farmer/dashboard.html">Farmers</a>
        <a href="login.html">Account</a>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script.js"></script>
  <script>
    const cartContainer = document.getElementById('cart-items-container');
    const emptyState = document.getElementById('cart-empty');
    const summary = document.getElementById('cart-summary');
    const cartTotal = document.getElementById('cart-total');
    const cartSubhead = document.getElementById('cart-subhead');

    function renderCart() {
      const items = getCartDetailed();
      const count = getCartCount();

      updateCartBadge();

      if (items.length === 0) {
        emptyState.style.display = 'block';
        summary.style.display = 'none';
        cartContainer.innerHTML = '';
        cartSubhead.textContent = 'Your cart is waiting for fresh picks.';
        return;
      }

      emptyState.style.display = 'none';
      summary.style.display = 'block';
      cartSubhead.textContent = `${count} item${count > 1 ? 's' : ''} in your cart.`;

      let html = '';
      items.forEach(({ product, qty }) => {
        html += `
          <div class="cart-item" style="display:flex; gap:20px; align-items:center; background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius); padding:16px; margin-bottom:12px;">
            <div style="width:80px; height:80px; border-radius:var(--radius-sm); background:#163a26; display:grid; place-items:center; flex-shrink:0;">
              <div style="width:50px; height:50px;">${ICONS[product.icon]}</div>
            </div>
            <div style="flex:1;">
              <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em;">${product.farmer}</div>
              <h3 style="font-size:16px; margin:4px 0;">${product.name}</h3>
              <div style="font-family:var(--font-mono); font-size:13px; color:var(--yellow);">₹${product.price} <span style="color:var(--text-faint);">/ ${product.unit}</span></div>
            </div>
            <div class="qty-control" style="display:flex; align-items:center; border:1px solid var(--surface-line); border-radius:var(--radius-sm); overflow:hidden;">
              <button style="width:34px;height:34px;background:transparent;border:none;color:var(--text);cursor:pointer;font-size:16px;" data-qty-minus="${product.id}">−</button>
              <span style="width:34px;text-align:center;font-family:var(--font-mono);" data-qty-value="${product.id}">${qty}</span>
              <button style="width:34px;height:34px;background:transparent;border:none;color:var(--text);cursor:pointer;font-size:16px;" data-qty-plus="${product.id}">+</button>
            </div>
            <button style="background:transparent;border:none;color:var(--text-faint);cursor:pointer;font-size:20px;" data-remove="${product.id}" aria-label="Remove ${product.name}">×</button>
          </div>
        `;
      });
      cartContainer.innerHTML = html;

      cartTotal.textContent = `₹${getCartTotal()}`;

      cartContainer.addEventListener('click', (e) => {
        const plusBtn = e.target.closest('[data-qty-plus]');
        const minusBtn = e.target.closest('[data-qty-minus]');
        const removeBtn = e.target.closest('[data-remove]');
        if (plusBtn) {
          const id = plusBtn.dataset.qtyPlus;
          const current = getCart().find(item => item.id === Number(id)).qty;
          updateCartQty(id, current + 1);
          renderCart();
          showToast('Quantity updated');
        }
        if (minusBtn) {
          const id = minusBtn.dataset.qtyMinus;
          const current = getCart().find(item => item.id === Number(id)).qty;
          if (current > 1) {
            updateCartQty(id, current - 1);
            renderCart();
            showToast('Quantity updated');
          } else {
            showToast('Minimum quantity is 1');
          }
        }
        if (removeBtn) {
          const id = removeBtn.dataset.remove;
          removeFromCart(id);
          renderCart();
          showToast('Item removed from cart');
        }
      });
    }

    document.getElementById('clear-cart-btn').addEventListener('click', () => {
      clearCart();
      renderCart();
      showToast('Cart cleared');
    });

    renderCart();
  </script>
</body>
</html>
